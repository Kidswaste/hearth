<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Runs untrusted sketch code: it may load three.js and addons from CDNs, nothing from the hub. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: blob:; img-src * data: blob:; connect-src * data: blob:; worker-src 'self' blob: https:; style-src 'self' 'unsafe-inline' https:">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111318; color: #ccc; font: 13px system-ui, sans-serif; }
  canvas { display: block; }
  #drop { position: fixed; inset: 0; display: none; place-items: center; text-align: center; color: #9aa; pointer-events: none; }
  body.viewer #drop.show { display: grid; }
  body.sketch { background: #000; }
  .lab-layer { position: fixed; inset: 0; overflow: hidden; pointer-events: none; transform-origin: 50% 50%; }
  .lab-layer.interactive { pointer-events: auto; }
  .lab-ghost { position: fixed; inset: 0; overflow: hidden; pointer-events: none; transform-origin: 50% 50%; }
</style>
<script>
  // Import map built from ?v= so the Lab can switch three.js versions.
  const params = new URLSearchParams(location.search);
  // Exact output sizes (1080×1920…) render at 1 device pixel per pixel, so the canvas matches the export.
  if (params.get('dpr')) { const dpr = Number(params.get('dpr')); Object.defineProperty(window, 'devicePixelRatio', { get: () => dpr }); }
  const V = params.get('v') || '0.186.1';
  const base = `https://cdn.jsdelivr.net/npm/three@${V}`;
  const im = document.createElement('script');
  im.type = 'importmap';
  im.textContent = JSON.stringify({ imports: { three: `${base}/build/three.module.js`, 'three/addons/': `${base}/examples/jsm/`, 'three/examples/jsm/': `${base}/examples/jsm/` } });
  document.currentScript.after(im);

  const post = (msg) => (window.__stageHost ? window.__stageHost.post({ source: 'three-sandbox', ...msg }) : parent.postMessage({ source: 'three-sandbox', ...msg }, '*'));
  // In the Stage window an exact frame size (fw × fh) is rendered at full size and scaled to fit the window.
  if (window.__stageHost && params.get('fw')) {
    const fw = Number(params.get('fw')); const fh = Number(params.get('fh'));
    Object.defineProperty(window, 'innerWidth', { get: () => fw });
    Object.defineProperty(window, 'innerHeight', { get: () => fh });
    const fit = () => {
      const vw = document.documentElement.clientWidth; const vh = document.documentElement.clientHeight;
      const k = Math.min(vw / fw, vh / fh);
      Object.assign(document.body.style, { position: 'absolute', margin: '0', overflow: 'hidden', width: `${fw}px`, height: `${fh}px`, left: `${(vw - fw * k) / 2}px`, top: `${(vh - fh * k) / 2}px`, transform: `scale(${k})`, transformOrigin: '0 0' });
    };
    addEventListener('DOMContentLoaded', fit);
    addEventListener('resize', fit); // the window resized; the sketch keeps seeing fw × fh
  }
  if (window.__stageHost) addEventListener('keydown', (e) => { if (e.key === 'F11') { e.preventDefault(); window.__stageHost.fullscreen(); } });
  const fmt = (v) => {
    if (typeof v === 'string') return v;
    if (v instanceof Error) return `${v.name}: ${v.message}`;
    try { return JSON.stringify(v, (k, x) => (typeof x === 'number' ? Number(x.toFixed?.(4) ?? x) : x)); } catch { return String(v); }
  };
  // Which layer logged / threw (the module fills these in once layers run).
  window.__layerOfStack = () => null;
  window.__layerOfUrl = () => null;
  for (const level of ['log', 'info', 'warn', 'error']) {
    const orig = console[level].bind(console);
    console[level] = (...args) => { post({ type: 'console', level, text: args.map(fmt).join(' '), layer: window.__layerOfStack(new Error().stack) }); orig(...args); };
  }
  // Line numbers for errors raised inside the sketch module (a blob: URL).
  // blob URLs look like blob:null/<uuid>:LINE:COL — take the first number pair after the URL.
  const lineOf = (stack) => { const m = /blob:[^\s)]*?:(\d+):(\d+)/.exec(stack || ''); return m ? Number(m[1]) : null; };
  addEventListener('error', (e) => post({ type: 'error', message: e.message, line: e.filename?.startsWith('blob:') ? e.lineno : lineOf(e.error?.stack), layer: window.__layerOfUrl(e.filename) || window.__layerOfStack(e.error?.stack) }));
  addEventListener('unhandledrejection', (e) => post({ type: 'error', message: String(e.reason?.message || e.reason), line: lineOf(e.reason?.stack), layer: window.__layerOfStack(e.reason?.stack) }));
</script>
</head>
<body>
<div id="drop"><div>Drop a .glb, .gltf, .fbx, .obj, .stl or .ply file<br><small>or use the Open button</small></div></div>
<script type="module">
// ---------- the motion-design kit (round 9: tools/three-motion*.js) ----------
// motion.<kind>(P, opts) inside a layer's code makes it a motion-design layer, like filter(type, P) does for filters:
// kinetic type, Hearth's own UI as 3D cards and devices, a cursor, camera moves, logo reveals, brand backgrounds and
// end cards. P is the layer's tweak() object (or the getters a node graph compiles to): every value is read each
// frame, so sliders, keyframes, looks and Shuffle work. Time first: a layer counts from its own start on the timeline
// or in the sequence (layer.time), never from the music unless asked; with nothing to follow (no song, no in point)
// the animation loops so the preview keeps playing. Camera layers publish a rig the 3D motion layers follow; with no
// 3D layer under them they move the whole picture (a filter). Runs before the main module: it only touches
// `layer`, `audio`, `filter` at call time.
import * as THREE from 'three';
const motion = (() => {
  const C01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const bounceOut = (t) => { const n = 7.5625; const d = 2.75; if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75; if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375; return n * (t -= 2.625 / d) * t + 0.984375; };
  const EASE = {
    linear: (t) => t, smooth: (t) => t * t * (3 - 2 * t), in: (t) => t * t * t, out: (t) => 1 - (1 - t) ** 3,
    inOut: (t) => (t < 0.5 ? 4 * t ** 3 : 1 - (-2 * t + 2) ** 3 / 2), expo: (t) => (t >= 1 ? 1 : 1 - 2 ** (-10 * t)),
    expoInOut: (t) => (t <= 0 ? 0 : t >= 1 ? 1 : t < 0.5 ? 2 ** (20 * t - 10) / 2 : (2 - 2 ** (-20 * t + 10)) / 2),
    back: (t) => 1 + 2.70158 * (t - 1) ** 3 + 1.70158 * (t - 1) ** 2,
    elastic: (t) => (t <= 0 ? 0 : t >= 1 ? 1 : 2 ** (-10 * t) * Math.sin((t * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1),
    bounce: bounceOut, sine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
  };
  const ease = (name, t) => (EASE[name] || EASE.out)(C01(t));
  const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  const vnoise = (x) => { const i = Math.floor(x); const f = x - i; const u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u) * 2 - 1; };
  const FORGE = { gold: '#ffd75e', ember: '#ff8c42', flame: '#ff5a36', violet: '#bd8bff', blue: '#48ddff', night: '#0b0b12', ink: '#14161d', paper: '#f4efe6' };
  const FONTS = { Oxanium: 'Oxanium, "Arial Black", system-ui, sans-serif', 'System': 'system-ui, -apple-system, "Segoe UI", sans-serif', Impact: 'Impact, "Arial Black", sans-serif', Serif: 'Georgia, "Times New Roman", serif', Mono: 'Consolas, "Courier New", monospace', Rounded: '"Arial Rounded MT Bold", "Nunito", system-ui, sans-serif' };
  const fontOf = (f) => FONTS[f] || f || FONTS.Oxanium;
  // P's value or a default (P can be a tweak() object, a node graph's getters or a plain object)
  const val = (P, k, d) => { const x = P?.[k]; return x === undefined || x === null || (typeof x === 'number' && !Number.isFinite(x)) ? d : x; };
  const num = (P, k, d) => { const x = Number(val(P, k, d)); return Number.isFinite(x) ? x : d; };

  // ---------- time ----------
  // A layer's own time (s) from its start on the timeline / in the sequence; with nothing to follow it loops over
  // `loop` seconds so the preview keeps playing.
  function follows() { const L = globalThis.layer; return Boolean(L && (L.in != null || (audio.loaded && !audio.live))); }
  function clock(loop) {
    const L = globalThis.layer;
    const t = L ? L.time : performance.now() / 1000;
    if (follows()) return Math.max(0, t);
    return loop > 0 ? ((t % loop) + loop) % loop : t;
  }
  // Start times (layer-local s) for n units: on the song's hit markers, else its beats (every `every` beats),
  // else every `secs` seconds. mode: auto | markers | beats | seconds
  function beatTimes(n, { start = 0, every = 1, secs = 0.5, mode = 'auto' } = {}) {
    const L = globalThis.layer;
    const out = [];
    const song = follows() && audio.loaded && !audio.live;
    const lt = L ? L.time : 0;
    let used = 'seconds';
    if (song && (mode === 'auto' || mode === 'markers')) {
      const s0 = audio.time - lt; // the layer's start in song time
      const hits = (audio.hits?.hit || []).filter((x) => x >= s0 + start - 1e-3);
      if (hits.length) { used = 'markers'; for (let i = 0; i < Math.min(n, hits.length); i++) out.push(hits[i] - s0); }
    }
    if (out.length < n && song && (mode === 'auto' || mode === 'beats' || mode === 'markers') && audio.bpm > 0 && audio.bar > 0) {
      const spb = 60 / audio.bpm;
      const bnow = (audio.bar - 1) * audio.beatsPerBar + (audio.beatInBar - 1) + audio.beatPhase;
      const from = out.length ? out[out.length - 1] + spb * every : start;
      const b0 = Math.ceil(bnow - (lt - from) / spb - 1e-3);
      for (let k = 0; out.length < n; k++) out.push((b0 + k * every - bnow) * spb + lt);
      if (used === 'seconds') used = 'beats';
    }
    const base = out.length ? out[out.length - 1] + secs : start;
    for (let k = 0; out.length < n; k++) out.push(base + k * secs);
    out.used = used;
    return out;
  }

  // ---------- frames ----------
  // The safe area of the frame for its shape: 9:16 keeps clear of the app's buttons and captions, 16:9 title-safe.
  function safe(W, H, zone = 'safe') {
    if (zone === 'full') return { x: 0, y: 0, w: W, h: H };
    const a = W / H;
    let m;
    if (a < 0.7) m = { t: 0.13, b: 0.21, l: 0.07, r: 0.13 };
    else if (a < 0.9) m = { t: 0.08, b: 0.12, l: 0.07, r: 0.07 };
    else if (a < 1.2) m = { t: 0.08, b: 0.1, l: 0.08, r: 0.08 };
    else m = { t: 0.1, b: 0.1, l: 0.1, r: 0.1 };
    if (zone === 'title') { m = { t: m.t + 0.03, b: m.b + 0.03, l: m.l + 0.03, r: m.r + 0.03 }; }
    return { x: W * m.l, y: H * m.t, w: W * (1 - m.l - m.r), h: H * (1 - m.t - m.b) };
  }
  function canvas2d() {
    const cv = document.createElement('canvas');
    cv.style.cssText = 'position:absolute;inset:0;width:100%;height:100%';
    document.body.append(cv);
    const S = { cv, g: cv.getContext('2d'), W: 1, H: 1 };
    const fit = () => { S.W = cv.width = Math.max(1, Math.round(innerWidth * devicePixelRatio)); S.H = cv.height = Math.max(1, Math.round(innerHeight * devicePixelRatio)); };
    fit();
    addEventListener('resize', fit);
    return S;
  }
  // a loop of frames drawn by fn(t) for this layer (the sandbox owns the frames: hidden / frozen layers wait)
  function every(fn) { const tick = () => { requestAnimationFrame(tick); fn(); }; requestAnimationFrame(tick); }
  function rr(g, x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); g.beginPath(); if (g.roundRect) g.roundRect(x, y, w, h, r); else { g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); } }
  function fillStyleOf(g, kind, color, accent, y0, y1) {
    if (kind === 'gradient') { const gr = g.createLinearGradient(0, y0, 0, y1); gr.addColorStop(0, color); gr.addColorStop(1, accent); return gr; }
    if (kind === 'gold') { const gr = g.createLinearGradient(0, y0, 0, y1); gr.addColorStop(0, '#fff3c4'); gr.addColorStop(0.45, '#ffd75e'); gr.addColorStop(0.55, '#c88a1e'); gr.addColorStop(1, '#ffe9a6'); return gr; }
    if (kind === 'chrome') { const gr = g.createLinearGradient(0, y0, 0, y1); gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.48, '#9aa3b5'); gr.addColorStop(0.52, '#3b4150'); gr.addColorStop(1, '#e6ebf5'); return gr; }
    if (kind === 'molten') { const gr = g.createLinearGradient(0, y0, 0, y1); gr.addColorStop(0, '#ffe08a'); gr.addColorStop(0.5, '#ff8c42'); gr.addColorStop(1, '#ff3b2f'); return gr; }
    return color;
  }

  // ---------- kinetic type ----------
  // Presets: unit (what animates on its own: char, word, line, all), layout (lines, stack = a word per line, solo = one
  // word at a time in the middle), stag (s between units), dur (s each unit takes), fx(p, o, c) sets o from the unit's
  // progress p (0..1, linear) and c = { t, life, gap, i, g (the glyph: relc, side, wi, iw, li) }.
  const GLYPHS = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789#$%&*+=<>?/';
  const TYPE = {
    'type-on': { name: 'Type on', unit: 'char', stag: 0.055, dur: 0.001, cursor: true, fx: (p, o) => { o.a = p > 0 ? 1 : 0; } },
    cascade: { name: 'Cascade', unit: 'char', stag: 0.04, dur: 0.6, fx: (p, o) => { o.a = C01(p * 3); o.y = (1 - ease('back', p)) * -0.9; } },
    split: { name: 'Split', unit: 'char', stag: 0, dur: 0.9, fx: (p, o, c) => { const e = ease('expo', p); o.x = (1 - e) * c.g.side * (1.5 + Math.abs(c.g.relc) * 0.6); o.a = C01(p * 2); } },
    slam: { name: 'Slam', unit: 'word', stag: 0.4, dur: 0.3, fx: (p, o, c) => { const e = ease('in', p); o.s = lerp(3.4, 1, e); o.a = C01(p * 5); const after = c.life - 0.3; if (after > 0) { const k = Math.exp(-after * 9) * 0.07; o.x += vnoise(c.t * 55 + c.i * 9) * k; o.y += vnoise(c.t * 61 + 3 + c.i) * k; } } },
    wave: { name: 'Wave', unit: 'char', stag: 0.045, dur: 0.6, fx: (p, o, c) => { o.a = C01(p * 2); o.y = (1 - ease('out', p)) * 0.7 + Math.sin(c.t * 4 - c.g.gi * 0.55) * 0.1 * C01(p); } },
    scramble: { name: 'Scramble', unit: 'char', stag: 0.035, dur: 0.55, fx: (p, o, c) => { if (p <= 0) { o.a = 0; return; } if (p < 1) { o.ch = GLYPHS[Math.floor(hash(Math.floor(c.life * 22) + c.g.gi * 13) * GLYPHS.length)]; o.k = 1; o.a = 0.85; } } },
    breathe: { name: 'Kerning breathe', unit: 'all', stag: 0, dur: 1.1, fx: (p, o, c) => { const spread = (1 - ease('expo', p)) * 0.9 + (Math.sin(c.t * 1.7) * 0.5 + 0.5) * 0.12; o.x = c.g.relc * spread; o.a = C01(p * 1.6); } },
    pop: { name: 'Pop', unit: 'char', stag: 0.04, dur: 0.45, fx: (p, o) => { o.s = Math.max(0, ease('back', p)); o.a = C01(p * 3); } },
    'blur-in': { name: 'Blur in', unit: 'char', stag: 0.03, dur: 0.8, fx: (p, o) => { const e = ease('out', p); o.blur = (1 - e) * 0.22; o.a = e; o.s = 1 + (1 - e) * 0.3; } },
    rise: { name: 'Rise (mask)', unit: 'line', stag: 0.14, dur: 0.75, clip: true, fx: (p, o) => { o.y = (1 - ease('expo', p)) * 1.15; } },
    flip: { name: 'Flip', unit: 'char', stag: 0.05, dur: 0.65, fx: (p, o) => { o.sy = ease('back', p); o.a = C01(p * 3); o.y = (1 - ease('out', p)) * -0.2; } },
    'tracking-in': { name: 'Tracking in', unit: 'all', stag: 0, dur: 1.3, fx: (p, o, c) => { const e = ease('expo', p); o.x = c.g.relc * (1 - e) * 1.3; o.a = ease('out', p); o.blur = (1 - e) * 0.08; } },
    glitch: { name: 'Glitch', unit: 'char', stag: 0.025, dur: 0.55, fx: (p, o, c) => { if (p <= 0) { o.a = 0; return; } if (p < 1) { const h = hash(Math.floor(c.life * 30) + c.g.gi * 7); o.x = (h - 0.5) * 0.5; o.a = h > 0.25 ? 1 : 0.2; o.rgb = 0.08; } } },
    'stagger-fade': { name: 'Stagger fade', unit: 'word', stag: 0.22, dur: 0.6, fx: (p, o) => { o.a = ease('smooth', p); o.y = (1 - ease('out', p)) * 0.3; } },
    bounce: { name: 'Bounce', unit: 'char', stag: 0.05, dur: 0.95, fx: (p, o) => { o.y = -(1 - ease('bounce', p)) * 1.6; o.a = C01(p * 4); } },
    elastic: { name: 'Elastic', unit: 'char', stag: 0.04, dur: 1.1, fx: (p, o) => { o.x = (1 - ease('elastic', p)) * -1.4; o.a = C01(p * 3); } },
    'spin-in': { name: 'Spin in', unit: 'char', stag: 0.05, dur: 0.75, fx: (p, o) => { o.r = (1 - ease('back', p)) * -Math.PI; o.s = ease('out', p); o.a = C01(p * 2); } },
    'word-by-word': { name: 'Word by word', unit: 'word', layout: 'solo', stag: 0.45, dur: 0.12, fx: (p, o, c) => { o.a = p > 0 && (c.life < c.gap || c.last) ? 1 : 0; o.s = 1 + 0.2 * Math.exp(-Math.max(0, c.life) * 11); } },
    highlight: { name: 'Highlight', unit: 'word', stag: 0.3, dur: 0.5, fx: (p, o) => { o.a = C01(p * 3); o.hl = ease('expo', p); } },
    stretch: { name: 'Stretch', unit: 'char', stag: 0.04, dur: 0.7, fx: (p, o) => { o.sy = lerp(2.4, 1, ease('elastic', p)); o.sx = lerp(0.35, 1, ease('out', p)); o.a = C01(p * 3); } },
    'outline-fill': { name: 'Outline to fill', unit: 'char', stag: 0.04, dur: 1.0, fx: (p, o) => { o.stroke = C01(p * 2.2); o.fill = C01(p * 2 - 1); o.a = 1; } },
    neon: { name: 'Neon flicker', unit: 'char', stag: 0.06, dur: 0.8, fx: (p, o, c) => { o.a = p <= 0 ? 0 : p >= 1 ? 1 : hash(Math.floor(c.life * 24) + c.g.gi * 5) > 0.45 ? 1 : 0.12; o.glow = 1.8; } },
    'zoom-through': { name: 'Zoom through', unit: 'word', layout: 'solo', stag: 0.6, dur: 0.35, fx: (p, o, c) => { const span = c.last ? Infinity : c.gap; if (p <= 0 || c.life > span) { o.a = 0; return; } o.s = lerp(0.15, 1, ease('expo', p)); o.blur = (1 - ease('out', p)) * 0.1; const out = c.last ? 0 : C01((c.life - span * 0.75) / (span * 0.25)); o.s *= 1 + ease('in', out) * 6; o.a = 1 - out; } },
    stack: { name: 'Stack', unit: 'word', layout: 'stack', stag: 0.18, dur: 0.6, fx: (p, o, c) => { o.x = (1 - ease('expo', p)) * (c.g.wi % 2 ? 2.2 : -2.2); o.a = C01(p * 3); } },
    count: { name: 'Count up', unit: 'all', stag: 0, dur: 1.6, count: true, fx: (p, o) => { o.a = C01(p * 4); o.s = 1 + 0.06 * Math.sin(C01(p) * Math.PI); } },
    marquee: { name: 'Marquee', unit: 'all', stag: 0, dur: 0.4, special: 'marquee', fx: (p, o) => { o.a = C01(p); } },
    circle: { name: 'Circle', unit: 'all', stag: 0, dur: 0.8, special: 'circle', fx: (p, o) => { o.a = C01(p); o.s = ease('back', p); } },
    wipe: { name: 'Wipe reveal', unit: 'line', stag: 0.2, dur: 0.8, clipX: true, fx: (p, o) => { o.wipe = ease('expoInOut', p); } },
    'drop-in': { name: 'Drop in', unit: 'word', stag: 0.2, dur: 0.7, fx: (p, o, c) => { o.y = -(1 - ease('back', p)) * 2.2; o.r = (1 - ease('out', p)) * 0.35 * (c.g.wi % 2 ? 1 : -1); o.a = C01(p * 3); } },
    'slide-up': { name: 'Slide up', unit: 'line', stag: 0.16, dur: 0.7, fx: (p, o) => { o.y = (1 - ease('expo', p)) * 1.2; o.a = ease('out', p); } },
    'scale-down': { name: 'Scale down', unit: 'all', stag: 0, dur: 0.9, fx: (p, o) => { const e = ease('expo', p); o.s = lerp(4, 1, e); o.a = C01(p * 2.5); o.blur = (1 - e) * 0.06; } },
    shimmer: { name: 'Shimmer', unit: 'char', stag: 0.03, dur: 0.5, fx: (p, o, c) => { o.a = ease('out', p); const band = ((c.t * 0.45) % 1.6) - 0.3; o.k = Math.max(0, 1 - Math.abs(c.g.nx - band) * 9) * C01(p); } },
    jitter: { name: 'Jitter (boil)', unit: 'char', stag: 0.03, dur: 0.4, fx: (p, o, c) => { o.a = C01(p * 2); const f = Math.floor(c.t * 8); o.x = (hash(f * 3 + c.g.gi) - 0.5) * 0.05; o.y = (hash(f * 5 + c.g.gi * 2) - 0.5) * 0.05; o.r = (hash(f * 7 + c.g.gi) - 0.5) * 0.08; } },
  };
  const EXITS = ['fade up', 'fade', 'reverse', 'drop', 'blur', 'none'];
  function layoutType(g, text, P, W, H, lay) {
    const zone = safe(W, H, val(P, 'zone', 'safe'));
    const fam = fontOf(val(P, 'font', 'Oxanium'));
    const weight = String(val(P, 'weight', '800'));
    const lineH = num(P, 'leading', 1.12);
    const track = num(P, 'tracking', 0.02);
    const kase = val(P, 'case', 'UPPER');

  for (const c of pics || []) fadeAway(c);

// Waiting for every layer of a new stack to draw: then the cover over it fades / the hub's cover goes.

  stackWait = w;

function stackDrew(id) { const w = stackWait; if (!w) return; w.ids.delete(id); if (!w.ids.size) w.fire(); }
// What a sketch can leave on the page outside its layers (styles on <body>, <style> / <link> tags), put back

const PAGE_PROPS = ['background', 'backgroundColor', 'backgroundImage', 'color', 'filter', 'cursor'];
let page0 = null;

  if (document.documentElement.style.background !== page0.html) document.documentElement.style.background = page0.html;

// For the live check (dev/checks/live.js): what runs leave behind. Nothing here should grow with edits.
window.__labHealth = () => ({ contexts: glAlive(), renderers: renderers.size, listeners: sketchListeners.length, intervals: sketchIntervals.size, layers: layers.size,
  overlays: document.querySelectorAll('.lab-xfade, .lab-swap, .lab-ghost').length, heapMB: performance.memory ? Math.round(performance.memory.usedJSHeapSize / 1048576) : null });

// ---------- sketch mode ----------
// spec.fx: 'xfade' (new code for this layer: cross-fade from its old picture) | 'reveal' (a new layer: wipe in)
async function runLayer(spec, hot = false) {
  // the layer's own slider values come with its code, so the two always match (a separate table could arrive for
  // another sketch's layers in between and shift every number this code reads)
  if (spec.values) Object.assign(TV, spec.values);
  installRunGuards();
  const L = layerState(spec.id);
  // the picture on screen stays on top until the new code draws (rapid edits keep the first picture)
  let pics = null;
  if (hot && spec.fx === 'xfade') {
    pics = (L.pics || []).filter((c) => c.isConnected && !c.__fading);
    if (!pics.length) pics = layerPictures(L);
  }
  if (hot || L.url) teardownLayer(L);
  if (pics?.length) L.box.append(...pics);
  L.pics = pics?.length ? pics : null;
  L.reveal = spec.fx === 'reveal';
  setLayerProps(L, spec);
  if (spec.pcOf) pcPlace(L);
  // a precomp (another scene as one layer) runs that scene's layers inside it; a card (a missing / looping source)
  // draws a line of text: neither has code of its own
  if (spec.precomp || spec.card) {
    if (L.url) { urlLayer.delete(L.url); URL.revokeObjectURL(L.url); L.url = null; }
    if (spec.precomp) await pcRun(L, spec.precomp); else pcCard(L, spec.card);
    if (!L.props.pcOf) post({ type: 'ran', hot, swap: Boolean(spec.swap), layer: L.id });
    return;
  }
  if (L.url) { urlLayer.delete(L.url); URL.revokeObjectURL(L.url); }
  const g = L.gen;
  // This run's code reads sliders through its own __tv: the live table while it's the layer's current run, the values
  // it was started with once a newer run replaced it (a module that was still loading would otherwise build its
  // scene from the next sketch's numbers). Same line count: errors still point at the right line.
  // (runs are told apart by a page-wide id: a scene swap makes fresh layer objects whose gen starts at 0 again)
  const rid = ++tvRunSeq; L.rid = rid;
  for (const k of tvRuns.keys()) if (k < rid - 8) tvRuns.delete(k);
  tvRuns.set(rid, spec.values || null);
  const code = /__tv\(/.test(spec.code) ? `const __tv = (i, d) => globalThis.__tvRun(${JSON.stringify(L.id)}, ${rid}, i, d);${spec.code}` : spec.code;
  const url = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
  L.url = url;
  urlLayer.set(url, L.id);
  sketchRunning = true;
  const inPc = Boolean(L.props.pcOf);
  if (inPc) PC.importing += 1;
  try {
    try { await import(url); } finally { if (inPc) PC.importing -= 1; }
    if (L.gen !== g) return;
    if (!inPc) post({ type: 'ran', hot, swap: Boolean(spec.swap), layer: L.id });
    realRAF(() => realRAF(() => { if (L.gen === g) slotPast[L.slot || 0] = true; }));
    // a layer that draws without a WebGLRenderer (2D canvas, DOM) or is hidden right now: done after a moment
    realSetTimeout(() => { if (L.gen === g && layers.get(L.id) === L) layerDrew(L); }, 700);
  } catch (err) {
    post({ type: 'error', layer: pcTop(L.id), message: `${L.props.pcOf ? `[◫ ${L.props.name || L.id}] ` : ''}${err.name}: ${err.message}`, line: Number(/blob:[^\s)]*?:(\d+):\d+/.exec(err.stack || '')?.[1]) || null });

  }
}
// All layers, bottom first (a fresh page). A layer that already runs is torn down first (a run sent twice).
function runLayers(specs) {
  for (const id of [...layers.keys()]) if (!specs.some((s) => s.id === id)) removeLayer(id);
  waitStack(specs.map((s) => s.id), () => post({ type: 'stack-drawn' }));
  specs.forEach((s, z) => runLayer({ z, ...s }));
}
// A whole new stack in this same page (another sketch, ▶ Run, a jam round): a picture of the old stack lies on top
// and fades once every new layer has drawn. three.js, the music and the live sound keep going.
function swapLayers(specs, fx = 'xfade') {
  let cover = null;
  if (fx && ordered().some((L) => layerMix(L) > 0)) {
    try {
      cover = composite(null, Math.min(1, 1280 / (Math.max(innerWidth, innerHeight) * devicePixelRatio)));
      cover.className = 'lab-swap';
      cover.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;z-index:99990;pointer-events:none';
      document.body.appendChild(cover);
    } catch { cover = null; }
  }
  for (const id of [...layers.keys()]) removeLayer(id);
  // what the old stack left that no layer could be told from: timers, window listeners, renderers, page styles
  gen += 1;
  for (const [t, type, fn, opts] of sketchListeners) t.removeEventListener(type, fn, opts);
  sketchListeners = [];
  for (const r of [...renderers]) {
    try { r.setAnimationLoop(null); } catch {}
    try { r.dispose(); r.forceContextLoss(); } catch {}
    r.domElement?.remove();
    renderers.delete(r);
  }
  lastRenderer = null;
  resetPage();
  waitStack(specs.map((s) => s.id), () => { if (cover) fadeAway(cover, 420); post({ type: 'stack-drawn' }); });
  specs.forEach((s, z) => runLayer({ z, ...s, swap: true }));
}

// ---------- shader mode ----------
let shader = null;
function setupShader() {
  const renderer = new THREE.WebGLRenderer({ antialias: false });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  document.body.append(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const size = new THREE.Vector2();
  const uniforms = { uTime: { value: 0 }, uResolution: { value: new THREE.Vector2() }, uMouse: { value: new THREE.Vector2() }, uFrame: { value: 0 } };
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
  scene.add(quad);
  const PREFIX = ['precision highp float;', 'uniform float uTime;', 'uniform vec2 uResolution;', 'uniform vec2 uMouse;', 'uniform int uFrame;', 'in vec2 vUv;', 'out vec4 fragColor;',
    '#define iTime uTime', '#define iResolution vec3(uResolution, 1.0)', '#define iMouse vec4(uMouse, 0.0, 0.0)', '#define iFrame uFrame'];
  let errorReported = false;
  renderer.debug.onShaderError = (gl, program, vs, fs) => {
    const log = gl.getShaderInfoLog(fs) || gl.getShaderInfoLog(vs) || gl.getProgramInfoLog(program) || 'Shader failed to compile';
    // three prepends its own lines (#version, SHADER_NAME…) before ours; find where the user's code starts.
    const source = gl.getShaderSource(fs) || '';
    const offset = source.split('\n').findIndex((l) => l.includes('__USER_CODE__')) + 1;
    const errors = [...log.matchAll(/ERROR:\s*\d+:(\d+):\s*(.*)/g)].map((m) => ({ line: Number(m[1]) - offset, message: m[2] }));
    errorReported = true;
    post({ type: 'shader-error', errors: errors.length ? errors : [{ line: null, message: log }] });
  };
  addEventListener('pointermove', (e) => uniforms.uMouse.value.set(e.clientX * renderer.getPixelRatio(), (innerHeight - e.clientY) * renderer.getPixelRatio()));
  addEventListener('resize', () => renderer.setSize(innerWidth, innerHeight));
  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    renderer.getDrawingBufferSize(size);
    uniforms.uResolution.value.copy(size);
    uniforms.uTime.value = clock.getElapsedTime();
    uniforms.uFrame.value += 1;
    renderer.render(scene, camera);
  });
  shader = {
    set(source) {
      let body = source;
      if (/mainImage\s*\(/.test(body) && !/void\s+main\s*\(/.test(body)) body += '\nvoid main() { mainImage(fragColor, gl_FragCoord.xy); }';
      errorReported = false;
      quad.material?.dispose();
      quad.material = new THREE.RawShaderMaterial({
        glslVersion: THREE.GLSL3,
        uniforms,
        vertexShader: 'in vec3 position; in vec2 uv; out vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position, 1.0); }',
        fragmentShader: `${PREFIX.join('\n')}\n// __USER_CODE__\n${body}`,
      });
      clock.start();
      uniforms.uFrame.value = 0;
      setTimeout(() => { if (!errorReported) post({ type: 'shader-ok' }); }, 150);
    },
  };
}

// ---------- model viewer mode ----------
let viewer = null;
async function setupViewer() {
  document.body.classList.add('viewer');
  document.getElementById('drop').classList.add('show');
  const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
  const { RoomEnvironment } = await import('three/addons/environments/RoomEnvironment.js');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.body.append(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1b1e25);
  const envTex = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environment = envTex;
  const hemi = new THREE.HemisphereLight(0xffffff, 0x444455, 0.6);
  scene.add(hemi);
  const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 1000);
  camera.position.set(3, 2, 4);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  const grid = new THREE.GridHelper(10, 20, 0x666666, 0x333333);
  const axes = new THREE.AxesHelper(1);
  scene.add(grid, axes);
  addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

  let model = null;
  let mixer = null;
  let clips = [];
  let boxHelper = null;
  let selectHelper = null;
  let normalHelpers = [];
  let speed = 1;
  const nodes = new Map();
  const materials = new Map();
  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    mixer?.update(clock.getDelta() * speed);
    boxHelper?.update();
    selectHelper?.update();
    controls.update();
    renderer.render(scene, camera);
  });

  function frame(obj) {
    const box = new THREE.Box3().setFromObject(obj);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const radius = Math.max(size.length() / 2, 0.001);
    camera.near = radius / 100;
    camera.far = radius * 200;
    camera.position.copy(center).add(new THREE.Vector3(1, 0.6, 1.3).normalize().multiplyScalar(radius * 2.6));
    camera.updateProjectionMatrix();

  function texInfo(tex) {
    const img = tex.image || tex.source?.data;
    const w = img?.width || img?.videoWidth || 0;
    const h = img?.height || img?.videoHeight || 0;
    const pot = (n) => n > 0 && (n & (n - 1)) === 0;
    return { uuid: tex.uuid, name: tex.name || '(unnamed)', w, h, pot: pot(w) && pot(h), bytes: Math.round(w * h * 4 * 1.333) };
  }

  function analyze(gltfJson) {
    let meshes = 0; let vertices = 0; let triangles = 0; let skinned = 0; let maxBones = 0; let drawCalls = 0;
    const textures = new Map();
    const heavy = [];
    materials.clear();
    nodes.clear();
    const tree = (o) => {
      nodes.set(o.uuid, o);
      return { uuid: o.uuid, name: o.name || `(${o.type})`, type: o.type, visible: o.visible, children: o.children.map(tree) };
    };
    model.traverse((o) => {
      if (!o.isMesh && !o.isPoints && !o.isLine) return;
      meshes += 1;
      const g = o.geometry;
      const count = o.isInstancedMesh ? o.count : 1;
      const v = g.attributes.position?.count || 0;
      const tris = o.isMesh ? (g.index ? g.index.count / 3 : v / 3) * count : 0;
      vertices += v * count;
      triangles += tris;
      const mats = [].concat(o.material);
      drawCalls += Math.max(1, g.groups.length || mats.length);
      if (tris > 100000) heavy.push({ name: o.name || o.type, tris });
      if (o.isSkinnedMesh) { skinned += 1; maxBones = Math.max(maxBones, o.skeleton.bones.length); }
      for (const m of mats) {
        if (!m) continue;
        materials.set(m.uuid, m);
        for (const val of Object.values(m)) if (val?.isTexture) textures.set(val.uuid, texInfo(val));
      }
    });
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const texList = [...textures.values()];
    const issues = [];
    if (triangles > 1_000_000) issues.push({ level: 'bad', text: `${(triangles / 1e6).toFixed(1)}M triangles in total. Aim for under 300k for web, decimate in Blender or use LODs.` });
    else if (triangles > 300_000) issues.push({ level: 'warn', text: `${Math.round(triangles / 1000)}k triangles. Fine on desktop, heavy on phones.` });
    for (const h of heavy) issues.push({ level: 'warn', text: `"${h.name}" alone has ${Math.round(h.tris / 1000)}k triangles.` });
    if (drawCalls > 200) issues.push({ level: 'warn', text: `About ${drawCalls} draw calls. Merge static meshes or share materials to cut this.` });
    if (materials.size > 25) issues.push({ level: 'warn', text: `${materials.size} materials. Atlas textures and reuse materials where possible.` });
    for (const t of texList) {
      if (Math.max(t.w, t.h) > 2048) issues.push({ level: 'warn', text: `Texture "${t.name}" is ${t.w}×${t.h} (~${Math.round(t.bytes / 1048576)} MB of GPU memory). 2048 or less is usually enough.` });
      if (!t.pot && t.w) issues.push({ level: 'info', text: `Texture "${t.name}" is ${t.w}×${t.h}, not a power of two (mipmaps still work in WebGL2, but POT sizes compress better).` });
    }

      if (!ext.includes('KHR_texture_basisu') && texList.length > 4) issues.push({ level: 'info', text: 'Textures are not KTX2. Compressed textures load faster and use ~4–8× less GPU memory.' });
    }

      meshes, vertices, triangles: Math.round(triangles), drawCalls, skinned, maxBones,
      size: size.toArray().map((n) => Number(n.toFixed(3))),
      materials: [...materials.values()].map((m) => ({
        uuid: m.uuid, name: m.name || '(unnamed)', type: m.type,
        color: m.color ? `#${m.color.getHexString()}` : null,
        emissive: m.emissive ? `#${m.emissive.getHexString()}` : null,
        roughness: m.roughness, metalness: m.metalness, opacity: m.opacity, transparent: m.transparent,
        maps: Object.entries(m).filter(([, v]) => v?.isTexture).map(([k]) => k),

      textures: texList, gpuTextureBytes: gpuTex,

  async function load({ name, buffer, extra = [] }) {

    const urls = new Map(extra.map((f) => [f.name, URL.createObjectURL(new Blob([f.buffer]))]));

      const { DRACOLoader } = await import('three/addons/loaders/DRACOLoader.js');
      const { MeshoptDecoder } = await import('three/addons/libs/meshopt_decoder.module.js');

    if (clips.length) mixer.clipAction(clips[0]).play();
    boxHelper = null; selectHelper = null;
    normalHelpers.forEach((h) => h.removeFromParent()); normalHelpers = [];

    normalHelpers.forEach((h) => h.removeFromParent());

    if (!on || !model) return;
    const { VertexNormalsHelper } = await import('three/addons/helpers/VertexNormalsHelper.js');
    let budget = 60000;
    model.traverse((o) => {
      if (!o.isMesh || budget <= 0) return;
      const v = o.geometry.attributes.position.count;
      if (v > budget) return;
      budget -= v;
      const h = new VertexNormalsHelper(o, 0.03 * (camera.position.distanceTo(controls.target) / 3), 0x00ff88);
      scene.add(h);
      normalHelpers.push(h);
    });
  };

  viewer = {
    load: (msg) => load(msg).catch((err) => post({ type: 'error', message: `Couldn't load ${msg.name}: ${err.message}` })),
    command({ cmd, value, uuid, prop }) {
      if (cmd === 'wireframe') materials.forEach((m) => { m.wireframe = value; });
      if (cmd === 'bbox') { if (boxHelper) scene.remove(boxHelper); boxHelper = value && model ? new THREE.BoxHelper(model, 0xffaa00) : null; if (boxHelper) scene.add(boxHelper); }
      if (cmd === 'grid') grid.visible = value;
      if (cmd === 'axes') axes.visible = value;
      if (cmd === 'background') scene.background = new THREE.Color(value);
      if (cmd === 'environment') { scene.environment = value ? envTex : null; hemi.intensity = value ? 0.6 : 2.2; }
      if (cmd === 'normals') setNormals(value);

      if (cmd === 'frame' && model) frame(model);
      if (cmd === 'visible') { const n = nodes.get(uuid); if (n) n.visible = value; }
      if (cmd === 'select') {
        if (selectHelper) scene.remove(selectHelper);
        const n = nodes.get(uuid);
        selectHelper = n ? new THREE.BoxHelper(n, 0x00e5ff) : null;
        if (selectHelper) scene.add(selectHelper);
      }
      if (cmd === 'material') {
        const m = materials.get(uuid);
        if (!m) return;
        if (prop === 'color' || prop === 'emissive') m[prop]?.set(value);
        else { m[prop] = value; if (prop === 'opacity') m.transparent = value < 1; }
        m.needsUpdate = true;
      }
      if (cmd === 'clip') {
        if (!mixer) return;
        mixer.stopAllAction();
        const c = clips.find((x) => (x.name || '(unnamed)') === value);
        if (c) mixer.clipAction(c).reset().play();
      }
      if (cmd === 'pause') speed = value ? 0 : 1;
      if (cmd === 'speed') speed = value;
      if (cmd === 'seek' && mixer) { mixer.setTime(value); }

  addEventListener('dragover', (e) => e.preventDefault());
  addEventListener('drop', async (e) => {
    e.preventDefault();
    const files = [...e.dataTransfer.files];
    const main = files.find((f) => /\.(glb|gltf|fbx|obj|stl|ply)$/i.test(f.name));
    if (!main) return;
    const extra = await Promise.all(files.filter((f) => f !== main).map(async (f) => ({ name: f.name, buffer: await f.arrayBuffer() })));
    viewer.load({ name: main.name, buffer: await main.arrayBuffer(), extra });
  });
