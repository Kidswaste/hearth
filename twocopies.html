<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Hearth</title>
<!-- (round 64, twocopies64) shown before the main window by a Hearth copy with no chats that finds another Hearth
     folder with chats on this computer (twocopiesmain.js). Plain words, three buttons, nothing else. -->
<style>
  :root { --bg: #16120f; --card: #201a15; --text: #f1e8df; --muted: #b8a999; --line: #3a2f26; --accent: #ff7a2f; --accent-ink: #1b0f06; --ghost: #2b231c; }
  @media (prefers-color-scheme: light) { :root { --bg: #f6f0ea; --card: #fffaf5; --text: #2a211a; --muted: #6f6256; --line: #e3d6c9; --accent: #e25d12; --accent-ink: #fff; --ghost: #f1e6db; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 26px 26px 20px; }
  h1 { font-size: 19px; margin: 0 0 8px; }
  p { margin: 0 0 14px; color: var(--muted); }
  p b { color: var(--text); }
  code { font: 12.5px/1.4 ui-monospace, Consolas, Menlo, monospace; background: var(--ghost); padding: 1px 5px; border-radius: 5px; word-break: break-all; color: var(--text); }
  .others { margin: 0 0 14px; display: grid; gap: 6px; }
  .others label { display: flex; gap: 8px; align-items: baseline; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .choices { display: grid; gap: 10px; }
  button { all: unset; box-sizing: border-box; display: block; width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); cursor: pointer; }
  button:hover, button:focus-visible { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button .t { display: block; font-weight: 600; font-size: 15px; color: var(--text); }
  button .s { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); }
  button.primary .t, button.primary .s { color: var(--accent-ink); }
  button[disabled] { opacity: .55; cursor: default; }
  #status { min-height: 20px; margin: 12px 0 0; color: var(--text); }
  #status.err { color: #ff8f7a; }
</style>
</head>
<body>
<main>
  <h1 id="title">Your chats are in another Hearth folder</h1>
  <p id="lead">Looking…</p>
  <div class="others" id="others" hidden></div>
  <div class="choices">
    <button type="button" class="primary" id="open"><span class="t">Open that one (recommended)</span><span class="s">Starts your Hearth with your chats and closes this one.</span></button>
    <button type="button" id="bring"><span class="t">Bring its chats here</span><span class="s">Copies its chats, memory and AIs into this one. The originals stay where they are.</span></button>
    <button type="button" id="fresh"><span class="t">Start fresh here</span><span class="s">Keeps this one empty. You won't be asked again.</span></button>
  </div>
  <div id="status" role="status" aria-live="polite"></div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  let st = null; let pick = '';
  const btns = ['open', 'bring', 'fresh'].map($);
  const lock = (on) => btns.forEach((b) => { b.disabled = on; });
  const say = (t, err = false) => { $('status').textContent = t; $('status').className = err ? 'err' : ''; };
  const code = (t) => { const c = document.createElement('code'); c.textContent = t; return c; };
  const chosen = () => st.others.find((x) => x.dir === pick) || st.others[0];
  function lead() {
    const o = chosen();
    const p = $('lead'); p.replaceChildren();
    const b = document.createElement('b'); b.textContent = plural(o.chats, 'chat');
    p.append('You already have Hearth with ', b, ' in ', code(o.dir), '. This one, in ', code(st.here), ', is new and has no chats yet. Nothing is moved or deleted, whatever you pick.');
  }
  (async () => {
    st = await window.twoCopies.info();
    if (!st || !st.others || !st.others.length) { $('lead').textContent = 'Nothing to choose.'; lock(true); return; }
    pick = st.others[0].dir;
    if (st.others.length > 1) {
      const box = $('others'); box.hidden = false;
      for (const [i, o] of st.others.entries()) {
        const r = document.createElement('input'); r.type = 'radio'; r.name = 'copy'; r.checked = i === 0;
        r.addEventListener('change', () => { pick = o.dir; lead(); });
        const l = document.createElement('label'); l.append(r, code(o.dir), ` · ${plural(o.chats, 'chat')}`);
        box.append(l);
      }
    }
    lead();
    $('open').focus();
  })();
  $('open').addEventListener('click', async () => {
    lock(true); say('Opening your Hearth…');
    const r = await window.twoCopies.choose('open', pick);
    if (r && r.folder) { lock(false); say(`Couldn't start it from here, so its folder is open now (${r.folder}): start Hearth from there, or pick another button.`, true); }
    else if (!r || !r.ok) { lock(false); say(`Couldn't start it: ${(r && r.error) || 'unknown reason'}.`, true); }
  });
  $('bring').addEventListener('click', async () => {
    lock(true); say(`Copying ${plural(chosen().chats, 'chat')}… (the originals aren't touched)`);
    const r = await window.twoCopies.choose('bring', pick);
    if (r && r.ok) say(`Done: ${plural(r.chats, 'chat')} copied${r.memory ? `, ${plural(r.memory, 'memory line')}` : ''}${r.agents ? `, ${plural(r.agents, 'AI')}` : ''}. Opening…`);
    else { lock(false); say(`Couldn't copy them: ${(r && r.error) || 'unknown reason'}. Nothing was changed in either folder.`, true); }
  });
  $('fresh').addEventListener('click', async () => { lock(true); await window.twoCopies.choose('fresh', pick); });
</script>
</body>
</html>
