<!doctype html>
<!-- A local stand-in for Pinterest's search results (round 30, pinboard: dev/pinboard-test.js reads it with a tiny DOM,
     dev/checks/pinboard.js serves it to a real Chromium). Like the real page: a header with a logo and an avatar, a
     grid of cards (data-test-id="pin") each linking to /pin/<id>/ around a picture with a 236x / 474x / 736x srcset,
     alt text starting "This may contain:", a title under some cards; and the traps: the same picture saved as another
     pin (#5), an ad (#7), a shopping link (#9), the same pin twice (#11). Scrolling near the bottom adds 8 more pins.
     data-y is the card's top for the Node test (the real browser lays it out by itself: rows 330 px apart). -->
<html><head><meta charset="utf-8"><title>Pinterest-like search</title>
<style>
body { margin: 0; font: 14px system-ui, sans-serif; background: #fff; color: #111; }
header { position: sticky; top: 0; height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #fff; border-bottom: 1px solid #eee; z-index: 2; }
header img { width: 32px; height: 32px; border-radius: 50%; }
.grid { display: grid; grid-template-columns: repeat(4, 236px); gap: 14px 16px; padding: 20px 16px; }
[data-test-id="pin"] { height: 316px; overflow: hidden; }
[data-test-id="pin"] img { width: 236px; height: 290px; display: block; border-radius: 16px; object-fit: cover; background: #ddd; }
[data-test-id="pinrep-title"], .promo { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style></head>
<body>
<header><img src="/pinboard/i/logo.png" alt="Pinterest" width="32" height="32"><input id="q" type="search" aria-label="Search"><a href="/me/"><img src="/pinboard/i/avatar.png" alt="Your profile" width="32" height="32"></a></header>
<div class="grid" id="grid">

  <div data-test-id="pin" data-grid-item data-y="1070"><a href="/pin/1013/" aria-label="Pin page"><img alt="This may contain: glass blob render" src="/pinboard/i/236x/ab/cd/ef/h13.jpg" srcset="/pinboard/i/236x/ab/cd/ef/h13.jpg 1x, /pinboard/i/474x/ab/cd/ef/h13.jpg 2x, /pinboard/i/736x/ab/cd/ef/h13.jpg 3x"></a><div data-test-id="pinrep-title">Glass blob render</div></div>

  <div data-test-id="pin" data-grid-item data-y="1400"><a href="/pin/1018/" aria-label="Pin page"><img alt="This may contain: vapor grid floor" src="/pinboard/i/236x/ab/cd/ef/h18.jpg" srcset="/pinboard/i/236x/ab/cd/ef/h18.jpg 1x, /pinboard/i/474x/ab/cd/ef/h18.jpg 2x, /pinboard/i/736x/ab/cd/ef/h18.jpg 3x"></a></div>
  <div data-test-id="pin" data-grid-item data-y="1400"><a href="/pin/1019/" aria-label="Pin page"><img alt="This may contain: iridescent shell" src="/pinboard/i/236x/ab/cd/ef/h19.jpg" srcset="/pinboard/i/236x/ab/cd/ef/h19.jpg 1x, /pinboard/i/474x/ab/cd/ef/h19.jpg 2x, /pinboard/i/736x/ab/cd/ef/h19.jpg 3x"></a><div data-test-id="pinrep-title">Iridescent shell</div></div>

<script>
document.getElementById('q').value = new URLSearchParams(location.search).get('q') || '';
let more = 0;
addEventListener('scroll', () => {
  if (more >= 2 || scrollY + innerHeight < document.documentElement.scrollHeight - 400) return;
  more += 1;
  for (let i = 0; i < 8; i++) {
    const id = 1100 + more * 10 + i; const h = 'm' + more + i;
    const d = document.createElement('div'); d.dataset.testId = 'pin';
    d.innerHTML = '<a href="/pin/' + id + '/" aria-label="Pin page"><img alt="This may contain: more ' + id + '" src="/pinboard/i/236x/ab/cd/ef/' + h + '.jpg" srcset="/pinboard/i/236x/ab/cd/ef/' + h + '.jpg 1x, /pinboard/i/736x/ab/cd/ef/' + h + '.jpg 3x"></a>';
    document.getElementById('grid').append(d);
  }
});
</script>
</body></html>
